name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 02:00 自动检查上游更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync with Upstream
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cmliu/CF-Workers-UsagePanel.git || true
          git fetch upstream main
          git checkout main
          if git merge upstream/main -m "chore: sync with upstream cmliu/CF-Workers-UsagePanel"; then
            echo "Successfully merged cleanly."
          else
            echo "Resolving merge conflicts..."
            git checkout --theirs _worker.js usage.json usage_config.json README.md LICENSE || true
            git checkout --ours .github/ || true
            git checkout --ours wrangler.toml || true
            git add -A
            git commit -m "chore: resolve merge conflicts preserving repo config" || true
          fi
          git push origin main
